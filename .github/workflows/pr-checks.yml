name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  # ---- unit + integration tests ----------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit and integration tests
        run: npm test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage
          retention-days: 7

  # ---- dependency vulnerability scan ------------------------------------
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: app
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # ---- terraform fmt / validate / plan ----------------------------------
  terraform:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
          terraform_wrapper: false

      - name: terraform fmt (check only)
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend, for validate)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init (with remote state)
        run: terraform init -input=false

      # Plan output is intentionally NOT posted back to the PR body: it can
      # contain sensitive attribute diffs. Reviewers read the job log.
      - name: terraform plan
        run: terraform plan -no-color -input=false -detailed-exitcode
        continue-on-error: true
        id: plan

      - name: Interpret plan exit code
        run: |
          case "${{ steps.plan.outcome }}" in
            success) echo "No changes." ;;
            failure) echo "Plan reported changes or failed - see the log above." ;;
          esac
