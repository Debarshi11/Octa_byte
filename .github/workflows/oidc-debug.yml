name: OIDC debug

# Temporary diagnostic. Prints the raw OIDC token claims so the IAM trust
# policy can be matched against what GitHub actually sends, rather than
# against documentation. Delete once the role trust policy is confirmed.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Print the OIDC token claims
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)

          echo "=== header ==="
          echo "$TOKEN" | cut -d. -f1 | tr '_-' '/+' | base64 -d 2>/dev/null | jq .

          echo "=== claims ==="
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq .

          echo "=== the single line the trust policy must match ==="
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r '"sub=\(.sub)"'
